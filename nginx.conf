# The whole nginx config of a nuwa-static app. Meru runs it as user 10001 with a read-only root filesystem: only
# /tmp is writable, so the pid file and every temp path live there. Logs go to the pod's stdout/stderr.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;

        # Meru's liveness and readiness probes.
        location = /heartbeat {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
        location / {
            try_files $uri $uri/ =404;
        }
    }
}
